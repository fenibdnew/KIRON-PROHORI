name: KIRON PROHORI — Deploy Official Download Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/website/**'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Package Official Download Website (/docs/website)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KIRON PROHORI Repository
        uses: actions/checkout@v4

      - name: Setup Pages Configuration
        uses: actions/configure-pages@v5

      - name: Verify Static Website Assets & Ensure .nojekyll
        run: |
          test -f docs/website/index.html
          test -f docs/website/app.js
          test -f docs/website/assets/kp-logo.svg
          touch docs/website/.nojekyll
          echo "Verified official GitHub Pages website files in docs/website/"

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: docs/website

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
