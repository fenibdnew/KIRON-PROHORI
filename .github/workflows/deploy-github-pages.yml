name: KIRON PROHORI — Deploy Official Download Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/website/**'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: Publish Official Download & Documentation Site (/docs/website)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout KIRON PROHORI Repository
        uses: actions/checkout@v4

      - name: Verify Static Website Entry Point & No Hardcoded Fake Binaries
        run: |
          test -f docs/website/index.html
          test -f docs/website/app.js
          touch docs/website/.nojekyll
          echo "Verified official GitHub Pages website files in docs/website/"

      - name: Configure GitHub Pages
        id: pages_config
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
